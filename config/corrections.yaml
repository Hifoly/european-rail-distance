  - nom: "Frontière Saint-Louis - Basel St. Johann (RINF)"
    source: rinf
    de: [7.567592, 47.577565]
    a: [7.5725294, 47.5703063]
    note: "RINF du 2026-09-28 : aucune section entre le point frontière EU00138 et le réseau suisse ; relié à Basel St. Johann (CH00016)"
  - nom: "Albertville - ligne de la Tarentaise (RINF)"
    source: rinf
    de: [6.3831804, 45.673387]
    a: [6.3822336, 45.6648599]
    note: "RINF du 2026-09-28 : la ligne de la Tarentaise (Moûtiers, Bourg-St-Maurice) forme un îlot de 19 points ; son extrémité (FR9900002170) est reliée à Albertville (FR0000002899), à 950 m"

# Lignes SNCF à exclure du graphe (code_ligne), par exemple un tracé erroné.
lignes_exclues:
  # Raccordement de Chaulnes (LGV Nord PK 98 vers ligne 259000, voie de service à 50 km/h) :
  # aucun TGV ne l'emprunte, mais il faisait passer les trajets Est <-> Nord (Reims, Meuse,
  # Lorraine, Strasbourg vers Haute-Picardie, Lille) par Laon et Chaulnes. RINF ne le connaît pas.
  # Constaté le 2026-09-28 (formes-des-lignes-du-rfn, jeu du 2022-03-24).
  - "226305"
  # Ligne 076000 (RER B, branche de Roissy) et 025000 (CDG Express) : leurs extrémités à
  # Aéroport-CDG-2 sont à moins de 150 m de l'Interconnexion Est (226310) et y étaient soudées,
  # alors qu'aucune voie ne les relie. Les trajets TGV vers CDG passaient par le RER B et Paris.
  # Aucune autre relation du périmètre ne les emprunte. Constaté le 2026-09-28.
  - "076000"
  - "025000"

