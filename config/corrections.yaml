# Demi-tours interdits : le graphe n'étant pas orienté, un itinéraire peut arriver par un
# raccordement et repartir en arrière sur la ligne rejointe (rebroussement). Au nœud le plus proche
# de « point », on interdit de passer de la ligne « de » à la branche de « vers » qui repart dans la
# même direction ; l'autre branche reste permise. « separer: true » : aucune liaison entre les deux
# lignes à ce nœud (fausse jonction créée par la tolérance de soudure de 150 m).
virages_interdits:
  # Raccordement de Migné-Auxances (570360, LGV SEA vers Poitiers) : il longe la ligne 570000 sur
  # 1 km avant de la rejoindre au nord de Poitiers, et son tracé est coupé à moins de 150 m d'elle,
  # d'où une fausse jonction au nœud nord. Tours - Futuroscope passait par la LGV, le raccord, puis
  # remontait de 6 km vers Futuroscope (102,1 km) au lieu de sortir au raccordement de
  # La Celle-Saint-Avant (570350). Constaté le 2026-09-29.
  - nom: "Raccordement de Migné-Auxances, fausse jonction nord"
    point: [0.35282, 46.61947]
    de: "570360"
    vers: "570000"
    separer: true
  - nom: "Raccordement de Migné-Auxances, jonction sud"
    point: [0.35026, 46.61003]
    de: "570360"
    vers: "570000"

# Lignes SNCF à exclure du graphe (code_ligne), par exemple un tracé erroné.
