# Corrections manuelles du réseau, à n'utiliser qu'en dernier recours.
# Chaque relation qui emprunte une de ces corrections est marquée « à vérifier »
# (sauf raccord « valide ») et la correction est citée dans la colonne remarques.

# Raccordements absents des tracés sources. La longueur retenue est la distance
# géodésique en ligne droite entre les deux points (donc approximative).
# « valide » (facultatif) : vérification sur carte (source, date, constat) ; un raccord
# validé ne rend plus à lui seul la relation « à vérifier » (il reste cité en remarque).
raccordements:
  - nom: "Raccord de Sète, ligne 810000 (Tarascon-Sète) sur ligne 640000 (Bordeaux-Sète)"
    source: sncf
    de: [3.679089, 43.414189]
    a: [3.674363, 43.414271]
    note: "extrémité de tracé à 384m de l'autre ligne dans formes-des-lignes-du-rfn (consulté le 2026-09-28), corrige les détours constatés au contrôle RINF"
    valide: "OpenStreetMap/OpenRailwayMap, 2026-09-29 : voie principale continue de 372 m entre les deux extrémités"
  - nom: "Raccord de Boulogne-Ville, ligne 311000 sur ligne 314000"
    source: sncf
    de: [1.61334, 50.719208]
    a: [1.613114, 50.721714]
    note: "extrémité de tracé à 280m de l'autre ligne dans formes-des-lignes-du-rfn (consulté le 2026-09-28), corrige les détours constatés au contrôle RINF"
    valide: "OpenStreetMap/OpenRailwayMap, 2026-09-29 : voie principale continue de 282 m (lignes Longueau-Boulogne et Boulogne-Calais)"
#  - nom: Raccordement de Pasilly (LGV Sud-Est > ligne Paris-Dijon)
